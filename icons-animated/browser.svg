<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 8.5 11.5 C 18.8 10.7, 29.2 10.8, 39.5 11.5 C 40.2 19.2, 40.1 27.2, 39.4 34.7 C 29.1 35.5, 18.8 35.4, 8.6 34.7 C 7.9 27, 7.9 19.1, 8.5 11.5 Z"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.49s" d="M 8.8 19 C 19 19.7, 29.4 19.6, 39.2 19"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.65s" d="M 12.5 15 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.76s" d="M 17 15.1 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.86s" d="M 21.5 15.1 l .01 0"/>
  </g>
</svg>
