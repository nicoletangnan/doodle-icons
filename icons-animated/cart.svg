<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.63s;animation-delay:0.00s" d="M 9.5 12.5 C 11.1 12.6, 12.7 12.9, 14.2 13.3 C 16 19.3, 17.5 25.3, 18.8 31.4 C 25.6 31.9, 32.4 31.5, 38.9 30.3 C 39.7 26.1, 40.3 21.9, 40.8 17.7 C 32.2 18.5, 23.5 18.6, 14.9 18.2"/>
    <path pathLength="1" style="animation-duration:0.17s;animation-delay:0.44s" d="M 17 22.6 C 24 23.2, 32 23, 39.7 22.2"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:0.57s" d="M 18 27.1 C 24.5 27.6, 31.5 27.4, 39.1 26.6"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.68s" d="M 21 35.9 C 22.1 35.9, 22.7 36.5, 22.7 37.5 C 22.7 38.5, 22 39.1, 21 39.1 C 20 39.1, 19.4 38.5, 19.4 37.5 C 19.4 36.5, 20 35.9, 21 35.9 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.78s" d="M 34 35.4 C 35.1 35.4, 35.7 36, 35.7 37 C 35.7 38, 35 38.6, 34 38.6 C 33 38.6, 32.4 38, 32.4 37 C 32.4 36, 33 35.4, 34 35.4 Z"/>
  </g>
</svg>
