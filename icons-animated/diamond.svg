<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.69s;animation-delay:0.00s" d="M 15 12.5 C 21 12, 27 12, 33 12.5 C 35.7 15.3, 38.2 18.3, 40.5 21.5 C 35.4 27.9, 29.9 33.9, 24 39.5 C 18.1 33.9, 12.6 27.9, 7.5 21.5 C 9.8 18.3, 12.3 15.3, 15 12.5 Z"/>
    <path pathLength="1" style="animation-duration:0.24s;animation-delay:0.49s" d="M 8.5 21.8 C 18.8 22.6, 29.2 22.6, 39.5 21.8"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.65s" d="M 15.8 13.4 C 17.5 16.2, 19.1 19, 20.6 21.9"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.76s" d="M 32.2 13.4 C 30.5 16.2, 28.9 19, 27.4 21.9"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.86s" d="M 20.9 22.6 C 21.9 27.9, 22.9 33.1, 24 38.2"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.97s" d="M 27.1 22.6 C 26.1 27.9, 25.1 33.1, 24.1 38.2"/>
  </g>
</svg>
