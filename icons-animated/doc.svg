<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 12 8 C 20 7.2, 29 7.4, 36 8 C 36.8 18.6, 36.7 30, 36 40 C 28 40.9, 19 40.7, 12 40 C 11.3 29.8, 11.3 18.4, 12 8 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.49s" d="M 17.5 15.5 C 21.5 15.1, 26.5 15.1, 30.5 15.5"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.59s" d="M 17.4 21 C 21.4 20.6, 26.4 20.6, 30.5 21"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.70s" d="M 17.5 26.5 C 21.5 26.1, 26.5 26.1, 30.4 26.5"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.80s" d="M 17.4 32 C 20 31.7, 22.6 31.7, 25 32"/>
  </g>
</svg>
