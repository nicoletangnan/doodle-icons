<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 13 9.5 C 17.5 9.1, 22 9, 26.5 9.3 C 30 12.4, 33.3 15.7, 36.3 19.2 C 36.8 25.6, 36.7 32.1, 36.1 38.4 C 28.5 39.2, 21 39.2, 13.4 38.5 C 12.7 28.9, 12.6 19.2, 13 9.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.49s" d="M 26.3 9.6 C 26.2 12.9, 26.3 16.1, 26.6 19.2 C 29.8 19.5, 33 19.6, 36.2 19.4"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.59s" d="M 19.5 24.5 C 22.4 27.4, 25.2 30.3, 28 33.3"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.70s" d="M 28.2 24.4 C 25.3 27.3, 22.4 30.2, 19.7 33.2"/>
  </g>
</svg>
