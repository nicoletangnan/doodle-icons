    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.58s" d="M 17 29.5 C 21.7 28.6, 26.3 28.6, 31 29.6"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.68s" d="M 22 33.5 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.79s" d="M 26.5 34.5 l .01 0"/>
