<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.67s;animation-delay:0.00s" d="M 8.5 33 C 8.2 22.8, 15 14.8, 24 14.8 C 33 14.8, 39.8 22.8, 39.5 33 C 39.4 34.3, 38.5 35.2, 37.2 35.2 C 28.5 35.6, 19.5 35.6, 10.8 35.2 C 9.5 35.2, 8.6 34.3, 8.5 33 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.47s" d="M 13.5 26.8 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.57s" d="M 17.6 21.8 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.68s" d="M 24 19.8 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.78s" d="M 30.4 21.8 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.89s" d="M 34.5 26.8 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.99s" d="M 24.2 29.8 C 25.7 28.4, 27.1 26.9, 28.5 25.3"/>
  </g>
</svg>
