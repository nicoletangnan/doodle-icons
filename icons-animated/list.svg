<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.00s" d="M 10.6 14.5 C 10.5 13.7, 11.1 13.3, 11.7 13.5 C 12.4 13.7, 12.55 14.6, 12.1 15.2 C 11.6 15.7, 10.7 15.3, 10.6 14.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.10s" d="M 17.5 14.5 C 24.3 14.1, 31.2 14.1, 37.5 14.5"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.21s" d="M 10.6 24 C 10.5 23.2, 11.1 22.8, 11.7 23 C 12.4 23.2, 12.55 24.1, 12.1 24.7 C 11.6 25.2, 10.7 24.8, 10.6 24 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.32s" d="M 17.5 24 C 24.3 23.6, 31.2 23.6, 37.5 24"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.43s" d="M 10.6 33.5 C 10.5 32.7, 11.1 32.3, 11.7 32.5 C 12.4 32.7, 12.55 33.6, 12.1 34.2 C 11.6 34.7, 10.7 34.3, 10.6 33.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.53s" d="M 17.5 33.5 C 24.3 33.1, 31.2 33.1, 37.5 33.5"/>
  </g>
</svg>
