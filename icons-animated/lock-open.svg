<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.52s;animation-delay:0.00s" d="M 15 25.5 C 21 24.8, 28 24.9, 33.5 25.5 C 34.6 30.2, 34.5 36, 33.8 40.5 C 27 41.4, 20.5 41.2, 14.6 40.5 C 13.8 35.7, 13.9 30.1, 15 25.5 Z"/>
    <path pathLength="1" style="animation-duration:0.21s;animation-delay:0.37s" d="M 31 24.8 C 31.3 18.9, 30.3 13.5, 25.6 12.1 C 21.3 10.8, 17.4 13.1, 16.5 17.4"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.51s" d="M 24.1 30.6 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.62s" d="M 24.1 34.8 C 24.1 35.7, 24.1 36.6, 24.1 37.4"/>
  </g>
</svg>
