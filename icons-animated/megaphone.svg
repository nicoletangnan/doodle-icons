<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.61s;animation-delay:0.00s" d="M 9.5 21 C 15 20, 20.4 18.2, 25.4 15.4 C 28.2 13.9, 30.9 12.2, 33.4 10.3 C 34.9 16.5, 36 22.8, 36.7 29.2 C 33.9 28.1, 31 27.4, 28 27.1 C 22 26.6, 16 26.9, 10.1 27.7 C 9.5 25.5, 9.3 23.2, 9.5 21 Z"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:0.43s" d="M 33.4 10.3 C 36.4 12.6, 37.7 17, 38 21 C 38.2 24, 37.7 27.5, 36.7 29.2"/>
    <path pathLength="1" style="animation-duration:0.20s;animation-delay:0.54s" d="M 15.5 27.6 C 16.2 30.9, 17 34.1, 18 37.2 C 19.8 37.4, 21.6 37.4, 23.4 37.1 C 22.5 33.9, 21.7 30.6, 21 27.2"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.67s" d="M 40.6 15.2 C 41.9 14.3, 43.1 13.4, 44.3 12.4"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.78s" d="M 41.4 20.8 C 42.8 20.6, 44.2 20.3, 45.5 19.9"/>
  </g>
</svg>
