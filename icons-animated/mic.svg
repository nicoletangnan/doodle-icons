<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.44s;animation-delay:0.00s" d="M 24 7.5 C 27.5 7.5, 29.8 9.9, 29.8 13.5 C 29.9 16.9, 29.9 20.3, 29.8 23.5 C 29.7 27, 27.4 29.3, 24 29.3 C 20.6 29.3, 18.3 27, 18.2 23.5 C 18.1 20.2, 18.1 16.8, 18.2 13.5 C 18.2 9.9, 20.5 7.5, 24 7.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.31s" d="M 21 13 C 23 12.8, 25 12.8, 27 13"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.41s" d="M 21 17.5 C 23 17.3, 25 17.3, 27 17.5"/>
    <path pathLength="1" style="animation-duration:0.26s;animation-delay:0.52s" d="M 13.5 22.5 C 13.7 29, 18 33.4, 24 33.4 C 30 33.4, 34.3 29, 34.5 22.5"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.70s" d="M 24 33.8 C 24 35.9, 24 38, 24 40"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.80s" d="M 18 40.5 C 22 41, 26 41, 30 40.5"/>
  </g>
</svg>
