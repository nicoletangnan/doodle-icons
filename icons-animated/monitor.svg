<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 8 10.5 C 18.7 9.6, 29.4 9.7, 40 10.5 C 40.8 16.4, 40.7 22.9, 40 28.6 C 29.3 29.5, 18.6 29.4, 8.1 28.6 C 7.3 22.8, 7.3 16.3, 8 10.5 Z"/>
    <path pathLength="1" style="animation-duration:0.22s;animation-delay:0.49s" d="M 9.5 24 C 19.5 24.7, 29.5 24.6, 38.6 24"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.65s" d="M 20.5 29.5 C 20.4 31.7, 19.6 33.5, 18 35"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.75s" d="M 27.6 29.5 C 27.7 31.7, 28.5 33.5, 30.1 35"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.86s" d="M 14 36.2 C 20.7 37, 27.4 36.9, 34.1 36.2"/>
  </g>
</svg>
