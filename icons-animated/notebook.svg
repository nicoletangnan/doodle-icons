    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.80s" d="M 20 18 C 23 17.8, 26 17.8, 29 18"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.91s" d="M 20 24 C 23 23.8, 26 23.8, 29 24"/>
