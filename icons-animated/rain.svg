<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.57s;animation-delay:0.00s" d="M 13 26.5 C 9.9 26.4, 7.8 24.3, 8 21.5 C 8.2 19, 10 17.3, 12.6 17.2 C 13.2 14, 15.8 11.9, 19 12.2 C 20.5 9.9, 23.1 8.7, 25.8 9.2 C 29.1 9.8, 31.2 12.4, 31.2 15.7 C 33.8 15.9, 35.7 17.7, 35.9 20.3 C 36.1 23.4, 33.9 25.9, 30.7 26.1 C 24.8 26.6, 18.9 26.6, 13 26.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.40s" d="M 14 31 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.51s" d="M 19 32 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.61s" d="M 24 31.5 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.72s" d="M 29 32 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.82s" d="M 16.5 36.5 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.93s" d="M 21.5 37 l .01 0"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:1.03s" d="M 26.5 36.5 l .01 0"/>
  </g>
</svg>
