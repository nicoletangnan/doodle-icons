<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1 }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.25s;animation-delay:0.00s" d="M 14 19 C 17.2 18.9, 19.2 21, 19.1 24.1 C 19 27.2, 16.9 29.1, 13.9 29 C 11 28.9, 9.1 26.9, 9.1 24 C 9.1 21.1, 11.1 19.1, 14 19 Z"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.17s" d="M 33 8.4 C 35.9 8.3, 37.8 10.2, 37.7 13.1 C 37.6 15.9, 35.7 17.7, 32.9 17.6 C 30.2 17.5, 28.4 15.7, 28.4 13 C 28.4 10.3, 30.3 8.5, 33 8.4 Z"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.33s" d="M 33 30.4 C 35.9 30.3, 37.8 32.2, 37.7 35.1 C 37.6 37.9, 35.7 39.7, 32.9 39.6 C 30.2 39.5, 28.4 37.7, 28.4 35 C 28.4 32.3, 30.3 30.5, 33 30.4 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.49s" d="M 18.6 21.6 C 21.9 19.7, 25.2 17.9, 28.6 16.2"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.59s" d="M 18.7 26.5 C 22 28.3, 25.3 30.1, 28.7 31.9"/>
  </g>
</svg>
