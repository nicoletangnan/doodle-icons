<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden;
      animation-name: draw; animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: forwards;
    }
    @keyframes draw {
      from { visibility: visible }
      to { visibility: visible; stroke-dashoffset: 0 }
    }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.55s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 9 12 C 19 11.2, 29 11.3, 39 12 C 39.7 19.6, 39.6 27.6, 38.9 35 C 29 35.9, 19 35.8, 9.2 35 C 8.4 27.5, 8.4 19.5, 9 12 Z"/>
    <path pathLength="1" style="animation-duration:0.18s;animation-delay:0.49s" d="M 21.5 12 C 21.6 19.7, 21.6 27.4, 21.5 35"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.61s" d="M 9.2 19.5 C 19.2 20.1, 29.2 20, 39 19.4"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.77s" d="M 9.3 27.3 C 19.3 27.9, 29.3 27.8, 38.9 27.2"/>
  </g>
</svg>
