    <path pathLength="1" style="animation-duration:0.17s;animation-delay:0.56s" d="M 24.2 24.5 C 24.4 28.4, 24.4 31.8, 24.1 35.2 C 23.9 38.2, 22.2 39.8, 20.2 39.1 C 18.5 38.5, 17.9 36.8, 18.5 35.1"/>
  </g>
</svg>
